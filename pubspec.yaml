name: notes
description: Minimalist AMOLED dark notes application with a configurable secret keyword for private two-person end-to-end encrypted messaging.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  share_plus: ^11.0.0
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
